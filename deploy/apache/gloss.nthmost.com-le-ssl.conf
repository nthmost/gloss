<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName gloss.nthmost.com
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8902/
    ProxyPassReverse / http://127.0.0.1:8902/
    RequestHeader set X-Forwarded-Proto "https"
    # static assets are content-addressed by deploy; let browsers cache them a while
    <LocationMatch "^/static/">
        Header set Cache-Control "public, max-age=3600"
    </LocationMatch>
    ErrorLog ${APACHE_LOG_DIR}/gloss_error.log
    CustomLog ${APACHE_LOG_DIR}/gloss_access.log combined

    SSLCertificateFile /etc/letsencrypt/live/gloss.nthmost.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/gloss.nthmost.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
