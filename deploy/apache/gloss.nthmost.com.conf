# Port 80: serve ACME challenges from the shared webroot, redirect everything else to https.
<VirtualHost *:80>
    ServerName gloss.nthmost.com
    Alias /.well-known/acme-challenge/ /var/www/html/.well-known/acme-challenge/
    <Directory /var/www/html/.well-known/acme-challenge/>
        Require all granted
    </Directory>
    RewriteEngine on
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
    ErrorLog ${APACHE_LOG_DIR}/gloss_error.log
    CustomLog ${APACHE_LOG_DIR}/gloss_access.log combined
</VirtualHost>
