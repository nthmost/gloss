# Temporary port-80 vhost used only until the first certificate is issued:
# serves ACME challenges and proxies everything else so the site is testable over http.
<VirtualHost *:80>
    ServerName gloss.nthmost.com
    Alias /.well-known/acme-challenge/ /var/www/html/.well-known/acme-challenge/
    <Directory /var/www/html/.well-known/acme-challenge/>
        Require all granted
    </Directory>
    ProxyPreserveHost On
    ProxyPass /.well-known/acme-challenge/ !
    ProxyPass / http://127.0.0.1:8902/
    ProxyPassReverse / http://127.0.0.1:8902/
    ErrorLog ${APACHE_LOG_DIR}/gloss_error.log
    CustomLog ${APACHE_LOG_DIR}/gloss_access.log combined
</VirtualHost>
