[project]
name = "gloss"
version = "0.1.0"
description = "Look up any word in any language and surf where its roots travelled."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "orjson>=3.10",
    "anthropic>=2.13",
]

[project.scripts]
gloss-ingest = "gloss.ingest:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["gloss"]
